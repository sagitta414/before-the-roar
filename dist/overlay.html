<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTR Broadcast Overlay</title><style>html,body{margin:0;background:transparent;color:white;font-family:Arial,sans-serif}.cue{position:fixed;bottom:7%;left:4%;width:min(780px,88%);display:flex;box-shadow:0 12px 35px #0005;border-bottom:3px solid #ff3158}.brand{display:grid;place-items:center;background:#ee254b;font-size:30px;font-weight:900;font-style:italic;padding:22px}.copy{padding:18px 24px;background:#111a28f2;flex:1}.meta{font-size:11px;letter-spacing:1.4px;color:#c4d0e3}.copy strong{display:block;font-size:26px;margin:9px 0}.copy p{font-size:17px;line-height:1.45;margin:0}.hint{margin:24px;color:#a6b9cf;font-size:13px;background:#142035;padding:14px;display:inline-block}[hidden]{display:none!important}</style></head><body><p class="hint" id="hint">BTR transparent browser overlay · follows the open match in this browser. Copy this URL for a frozen cue in another renderer; the cue expires after six seconds.</p><div class="cue" id="cue" hidden><div class="brand">BTR</div><div class="copy"><span class="meta" id="meta"></span><strong id="title"></strong><p id="body"></p></div></div><script type="module">
import {matchStory} from './match-story.js';import {DEFAULT_SESSION,reduceSession} from './match-session.js';
const params=Object.fromEntries(new URLSearchParams(location.search)),initial=reduceSession(DEFAULT_SESSION,{scenario:params.scenario}),state=reduceSession(initial,{...params,corrected:params.corrected==='true'}),cue=document.querySelector('#cue');let timer;
function render(input){const s=matchStory(input);document.documentElement.lang=s.language;document.querySelector('#meta').textContent=`${s.clock} · R${s.revision} · SYNTHETIC MATCH`;document.querySelector('#title').textContent=s.title;document.querySelector('#body').textContent=s.body;cue.hidden=false;clearTimeout(timer);timer=setTimeout(()=>cue.hidden=true,6000);}
render(state);if('BroadcastChannel'in window){const channel=new BroadcastChannel('btr-match-cue-v1');channel.onmessage=e=>{if(e.data?.type==='match-state'){const next=reduceSession(state,{scenario:e.data.state.scenario});render(reduceSession(next,e.data.state));}};}
if(params.clean==='1')document.querySelector('#hint').hidden=true;
</script></body></html>
