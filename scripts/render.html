<!doctype html><html><head><meta charset="utf-8"><title>Before the Roar — Film studio</title><style>body{background:#102018;color:#d8edc8;font:16px system-ui;margin:24px}canvas{display:block;width:min(100%,1280px);height:auto;border-radius:14px}button,select{font:inherit;padding:12px;margin:10px 10px 18px 0}#status{display:inline-block}</style></head><body><h1>Synthetic film studio</h1><p>Render three 36-second videos from the exact match trajectories. No external service.</p><select id="scene" aria-label="Scene"><option value="0">Wide overload</option><option value="1">Coordinated press</option><option value="2">Counterattack</option></select><button id="preview">Preview motion</button><button id="record">Render all clips</button><span id="status" role="status">Loading renderer…</span><canvas id="film" width="1280" height="720"></canvas><script type="module">
import {createReplay} from '/__studio/replay3d.js';import {SCENARIOS} from '/engine.js';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),select=document.querySelector('select');
let replay;try{replay=createReplay(canvas);replay.render(SCENARIOS[0],18);status.textContent='Ready · 1280 × 720';}catch(e){status.textContent=e.message;throw e;}
let previewId;select.onchange=()=>{cancelAnimationFrame(previewId);replay.render(SCENARIOS[Number(select.value)],18)};
document.querySelector('#preview').onclick=()=>{cancelAnimationFrame(previewId);const start=performance.now();function tick(now){replay.render(SCENARIOS[Number(select.value)],((now-start)/1000)%36);previewId=requestAnimationFrame(tick)}previewId=requestAnimationFrame(tick)};
document.querySelector('#record').onclick=async()=>{cancelAnimationFrame(previewId);document.querySelectorAll('button,select').forEach(el=>el.disabled=true);
 try{for(const s of SCENARIOS){status.textContent=`Rendering ${s.id}…`;replay.render(s,0);const stream=canvas.captureStream(30),chunks=[];const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5500000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const stopped=new Promise(resolve=>recorder.onstop=resolve);recorder.start();
  await new Promise(resolve=>{const start=performance.now();function tick(now){const t=Math.min(36,(now-start)/1000);replay.render(s,t);status.textContent=`Rendering ${s.id} · ${t.toFixed(1)} / 36s`;if(t<36)requestAnimationFrame(tick);else resolve()}requestAnimationFrame(tick)});
  recorder.stop();await stopped;stream.getTracks().forEach(track=>track.stop());const blob=new Blob(chunks,{type:'video/webm'});const res=await fetch('/__capture/'+s.id,{method:'POST',body:blob});if(!res.ok)throw Error('Could not save '+s.id);status.textContent=`Saved ${s.id}`;
 }status.textContent='Complete · all 3 clips saved';}catch(e){status.textContent='Error: '+e.message;}finally{document.querySelectorAll('button,select').forEach(el=>el.disabled=false)}
};
</script></body></html>
